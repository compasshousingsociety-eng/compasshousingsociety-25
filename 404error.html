<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Compass Housing | Page Not Found</title>
  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      overflow-x: hidden;
      position: relative;
    }

    /* Transparent Compass Housing Society Logo Background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('images/transparent-logo-1.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 550px auto;
      opacity: 0.12;
      pointer-events: none;
      z-index: -1;
    }

    /* ===== COLOR SYSTEM ===== */
    :root {
      --primary: #094C3B;
      --accent: #FFE353;
      --white: #ffffff;
      --black: #000000;
    }

    /* Typography - exact sizes as per hierarchy */
    h1 {
      font-size: 45px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1rem;
    }
    h2 {
      font-size: 33px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 0.75rem;
    }
    h3 {
      font-size: 23px;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    h4 {
      font-size: 22px;
      font-weight: 600;
    }
    h5 {
      font-size: 21px;
      font-weight: 600;
    }
    h6 {
      font-size: 20px;
      font-weight: 600;
    }
    p, span, li, .footer-text, .btn, input, .card-text, .nav-link, .contact-info, .news-text {
      font-size: 18px;
    }

    /* Buttons - equal padding & border-radius */
    .btn-custom {
      background-color: var(--primary);
      color: var(--white);
      padding: 12px 32px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 500;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.25s ease;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-custom:hover {
      background-color: #06362a;
      color: var(--white);
      transform: translateY(-2px);
    }

    /* Remove yellow border on focus/active for buttons */
    .btn-custom:focus, .btn-custom:active, .btn-custom:focus-visible {
      outline: none;
      box-shadow: none;
      background-color: var(--primary);
    }

    /* 404 Section */
    .error-404-section {
      padding: 100px 0 80px;
      position: relative;
    }
    .error-code {
      font-size: 140px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary) 0%, #0e6b53 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 8px;
    }

    /* Section Gaps - 35px */
    .section-gap {
      margin-bottom: 35px;
    }
    .gap-top {
      margin-top: 35px;
    }
    .gap-bottom {
      margin-bottom: 35px;
    }

    /* Footer */
    .footer {
      background-color: var(--primary);
      color: #e0e7e3;
      padding: 50px 0 25px;
      margin-top: 0;
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-size: 18px;
      transition: 0.2s;
    }
    .footer a:hover {
      color: white;
      text-decoration: underline;
    }
    .footer .social-icon {
      font-size: 20px;
      margin-right: 15px;
      color: var(--accent);
    }
    .footer .social-icon:hover {
      color: white;
    }
    hr {
      background-color: rgba(255,255,255,0.2);
      margin: 30px 0 20px;
    }

    /* Newsletter Section */
    .newsletter-box {
      background: #FCF9EC;
      border-radius: 28px;
      padding: 40px;
    }
    .form-control-custom {
      padding: 12px 20px;
      font-size: 18px;
      border-radius: 60px;
      border: 1px solid #ddd;
    }
    .form-control-custom:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: none;
    }

    /* Remove all focus outlines from any element */
    a:focus, button:focus, .btn:focus, input:focus, a:focus-visible, button:focus-visible {
      outline: none;
      box-shadow: none;
    }

  

    /* Responsive */
    @media (max-width: 992px) {
      h1 { font-size: 40px; }
      h2 { font-size: 30px; }
      .error-code { font-size: 110px; }
    }
    @media (max-width: 768px) {
      h1 { font-size: 36px; }
      h2 { font-size: 28px; }
      .error-code { font-size: 80px; }
      .error-404-section { padding: 70px 0 50px; }
      .section-gap { margin-bottom: 30px; }
      .btn-custom { padding: 10px 24px; }
      .newsletter-box { padding: 28px; }
    }
    @media (max-width: 576px) {
      .error-code { font-size: 65px; letter-spacing: 4px; }
    }
  </style>
</head>
<body data-theme="light">



<!-- ==================== MAIN CONTENT ==================== -->
<main>
  <!-- 404 Error Section -->
  <div class="container error-404-section">
    <div class="row justify-content-center text-center">
      <div class="col-lg-8 col-md-10">
        <div class="error-code mb-2">404</div>
        <h1 class="mb-3">Property Not Found</h1>
        <p class="mb-4">The listing you're searching for may have been sold, relocated, or never existed. But don't worry — we have premium real estate opportunities waiting for you.</p>
        <div class="d-flex flex-wrap gap-3 justify-content-center">
          <a href="index.html" class="btn-custom"><i class="fas fa-home"></i> Back to Home</a>
        </div>
      </div>
    </div>
  </div>


</main>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Email pattern validation as per requirement
  const emailPattern = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.(com|in|org|net)$/i;

  document.addEventListener('DOMContentLoaded', function() {
    const subscribeBtn = document.getElementById('subscribeBtn');
    const emailInput = document.getElementById('newsEmail');
    const msgDiv = document.getElementById('emailValidationMsg');

    if (subscribeBtn && emailInput) {
      subscribeBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const emailValue = emailInput.value.trim();
        if (!emailValue) {
          msgDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please enter your email address.';
          msgDiv.style.color = '#d9534f';
          return;
        }
        if (emailPattern.test(emailValue)) {
          msgDiv.innerHTML = '<i class="fas fa-check-circle"></i> Thank you! You\'ll receive exclusive real estate alerts.';
          msgDiv.style.color = '#094C3B';
          emailInput.value = '';
          setTimeout(() => { msgDiv.innerHTML = ''; }, 4000);
        } else {
          msgDiv.innerHTML = '<i class="fas fa-times-circle"></i> Invalid email. Use .com, .in, .org, or .net domains only.';
          msgDiv.style.color = '#d9534f';
        }
      });
    }
  });
</script>

<style>
  /* Additional styles for cards and missing classes */
  .card-equal {
    height: 100%;
    border-radius: 24px;
    border: none;
    transition: all 0.3s ease;
    background: var(--white);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
  }
  .card-equal:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
  }
  .card-img-top-equal {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
  }
  .card-body {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
  }
  .card-text {
    margin-bottom: 1.25rem;
  }
  .card-btn {
    width: 100%;
    text-align: center;
    justify-content: center;
    margin-top: auto;
  }
  .btn-custom.card-btn {
    display: flex;
  }
  .btn-custom[style*="background-color: transparent"]:hover {
    background-color: var(--primary) !important;
    color: var(--white) !important;
  }
</style>
</body>
</html>
